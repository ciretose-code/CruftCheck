name: CruftCheck
options:
  bundleIdPrefix: com.ciretose.mac.util
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  # Stamps LastUpgradeCheck. XcodeGen defaults to 1430, which makes Xcode offer
  # "update to recommended settings" on every open no matter how current the
  # settings actually are — and accepting that offer edits the generated project,
  # which the next generate discards.
  xcodeVersion: "26.5"

# Project-level, so both targets inherit one copy. Xcode's recommended-settings
# check asks for these at the project level specifically, and it keeps asking if
# they're only set per-target.
settings:
  base:
    DEAD_CODE_STRIPPING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOL_EXTENSIONS: YES
    DEVELOPMENT_TEAM: 6D39SX3E6V

targets:
  CruftCheck:
    type: application
    platform: macOS
    sources:
      - path: CruftCheck
    info:
      path: CruftCheck/Info.plist
      properties:
        CFBundleName: Cruft/Check
        CFBundleDisplayName: Cruft/Check
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
        # No TCC purpose strings here on purpose. They are per-category rationales shown
        # inside the prompt for that category — NSDesktopFolderUsageDescription appears in
        # "would like to access files in your Desktop folder", and nothing else. The app
        # reads ~/Library and the application directories, never ~/Desktop, so the prompt
        # can't fire and the string would never be seen.
        #
        # Full Disk Access, which is what this app actually needs, has no purpose string at
        # all: it's granted by hand in System Settings and macOS supplies its own wording.
        # There is no key that annotates it.
    entitlements:
      path: CruftCheck/CruftCheck.entitlements
      properties:
        # The App Sandbox is OFF by design. A sandboxed app cannot enumerate
        # ~/Library or call trashItem() on arbitrary paths there without the user
        # hand-picking every folder in an NSOpenPanel, which defeats the tool.
        # Distribution outside the Mac App Store is the intended path; grant the
        # built app Full Disk Access in System Settings > Privacy & Security.
        com.apple.security.app-sandbox: false
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ciretose.mac.util.CruftCheck
        MARKETING_VERSION: "0.1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
        # Names the Icon Composer document in CruftCheck/AppIcon.icon. Without it the
        # build produces an app with the generic blank icon and no warning.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Both configurations build with a development identity. Developer ID signing
        # happens at *export*, not at build: Scripts/ExportOptions.plist sets
        # method=developer-id, and xcodebuild -exportArchive re-signs the archived app
        # with the Developer ID certificate on the way out.
        #
        # Forcing CODE_SIGN_IDENTITY to "Developer ID Application" on Release instead is
        # the thing Xcode's "Switch to Development Signing" recommendation exists to undo,
        # so it reappears as a pending change every time the project is opened. The export
        # step is where the identity is verified — see release.sh, which fails if the
        # exported app is not Developer ID signed.
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  CruftCheckTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: CruftCheck
    settings:
      base:
        # Distinct from the app's. Changing the identifier in Xcode's target editor with
        # every target selected sets them all to the same value, which leaves the test
        # bundle impersonating the app.
        PRODUCT_BUNDLE_IDENTIFIER: com.ciretose.mac.util.CruftCheckTests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        # DEVELOPMENT_TEAM is inherited from the project, not restated here — that's
        # Xcode's "Inherit Development Team from Project Settings" recommendation.
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic

schemes:
  CruftCheck:
    build:
      targets:
        CruftCheck: all
        CruftCheckTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CruftCheckTests
